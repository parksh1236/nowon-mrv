name: Deploy static site to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Create VWorld runtime config
        env:
          VWORLD_API_KEY: ${{ secrets.VWORLD_API_KEY }}
        run: node -e "const fs=require('node:fs');const key=process.env.VWORLD_API_KEY;if(!key)throw new Error('VWORLD_API_KEY is not configured');fs.writeFileSync('solar/config.local.js','window.SOLAR_CONFIG = '+JSON.stringify({vworldApiKey:key,allowedRegion:'노원구'})+';\n')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
